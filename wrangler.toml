# Website version on Cloudflare Pages (free). Set up with: npm run web:setup  (see README → Website)
name = "interpreter-helper"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "interpreter-helper"
database_id = "d14a984f-fd12-4ee8-8b26-60f33f53996c" # replaced by npm run web:setup

[ai]
binding = "AI"
