<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Church Interpreter Helper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="session-bar">
      <div class="session-info">
        <span id="sessionTitle">No session</span>
        <span id="sessionScripture"></span>
        <span id="sessionSpeaker"></span>
      </div>
      <button id="manageSessionsBtn" class="pill-btn">Manage Sessions</button>
    </div>

    <main class="chat-container">
      <ul id="chatLog" class="chat-log"></ul>
      <form id="chatForm" class="chat-form">
        <textarea
          id="chatInput"
          class="chat-input"
          placeholder="Ask for a translation or scripture..."
          autocomplete="off"
          rows="1"
        ></textarea>
        <button type="submit" class="pill-btn">Send</button>
      </form>
    </main>

    <dialog id="sessionDialog" class="modal">
      <form method="dialog" class="modal-card">
        <header>
          <h2>Sessions</h2>
          <p class="muted">
            Sessions keep message title, scripture, and speaker together for quick recall.
          </p>
        </header>
        <section id="sessionList" class="session-list"></section>
        <hr />
        <label class="field">
          <span class="field-label">Message title</span>
          <input id="newTitle" placeholder="Sunday Service - Faith" required />
        </label>
        <label class="field">
          <span class="field-label">Scripture passage</span>
          <input id="newScripture" placeholder="John 15:1-11" />
        </label>
        <label class="field">
          <span class="field-label">Pastor / Speaker</span>
          <input id="newSpeaker" placeholder="Pastor Kim" />
        </label>
        <menu class="modal-actions">
          <button value="cancel" class="ghost-btn">Cancel</button>
          <button id="createSessionBtn" value="default" class="pill-btn">
            Create & select
          </button>
        </menu>
      </form>
    </dialog>

    <template id="chatBubbleTemplate">
      <li class="chat-bubble">
        <div class="chat-meta"></div>
        <div class="chat-text"></div>
      </li>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
